name: Build & Release Safie Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/safie-v1.0.0-delhi-ncr.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safie-v1.0.0-apk
          path: release-artifacts/safie-v1.0.0-delhi-ncr.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-delhi
          name: "Safie v1.0.0 Delhi NCR Pilot Release"
          body: |
            ## Safie Android Mobile Release (Delhi NCR Pilot)
            
            This release contains the standalone sideloadable APK for the Safie personal safety mobile application.
            
            ### Included Capabilities:
            - **10-Second Safety Hold**: Physical Dead Man's Switch with haptic sensory feedback.
            - **Covert Duress PIN (9876)**: Deceptive alarm clearance with silent high-priority SOS dispatch.
            - **Zero-Data BLE Mesh Flood Relay**: Background distress beacon broadcasting without cellular coverage.
            - **Night Corridor Navigation**: Safety-weighted walking routing grounded in GMDA CCMS smart streetlights.
            - **28 Verified Safe Sanctuaries**: Detour navigation to 24/7 pharmacies, hospitals, and transit security points.
            
            ### Verification:
            - **Target SDK**: Android 14 (API 34)
            - **Min SDK**: Android 8.0 (API 26)
          files: release-artifacts/safie-v1.0.0-delhi-ncr.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
